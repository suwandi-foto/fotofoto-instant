<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #000000; color: #edeff1; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #d68a3c; } a:hover { color: #b8752f; }
    .disp { font-family: 'Archivo', system-ui, sans-serif; }
    button { font-family: inherit; cursor: pointer; }
  </style>
</helmet>

<div style="width: 390px; min-height: 1120px; background: #000000; display: flex; flex-direction: column; position: relative;">

  <div style="display: flex; align-items: center; gap: 10px; padding: 20px 20px 14px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#98a3b1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    <div style="flex-grow: 1;">
      <div class="disp" style="font-size: 15.5px; font-weight: 700;">Trade Show Booth</div>
      <div style="font-size: 11px; color: #98a3b1; margin-top: 1px;">Photo 42 of 214 &middot; tap a pin to read its note</div>
    </div>
  </div>

  <div style="padding: 0 20px;">
    <div style="position: relative; width: 100%; height: 420px; border-radius: 14px; background: linear-gradient(155deg, #2f2f33, #131315); overflow: hidden;">
      <sc-for list="{{ pins }}" as="pin" hint-placeholder-count="3">
        <button onClick="{{ pin.select }}" style="position: absolute; top: {{ pin.top }}; left: {{ pin.left }}; width: 26px; height: 26px; border-radius: 50%; background: {{ pin.bg }}; border: 2px solid #000000; color: #000000; font-size: 11px; font-weight: 800; display: flex; align-items: center; justify-content: center; transform: translate(-50%, -50%);">{{ pin.n }}</button>
      </sc-for>
    </div>
  </div>

  <div style="padding: 12px 20px 4px; display: flex; align-items: center; gap: 12px;">
    <button onClick="{{ toggleLike }}" style="display: flex; align-items: center; gap: 6px; border: 1.5px solid {{ heartBorder }}; border-radius: 999px; padding: 8px 14px; background: {{ heartBg }};">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="{{ heartFill }}" stroke="{{ heartStroke }}" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6c-1.6-1.6-4.2-1.6-5.8 0L12 7.6l-3-3c-1.6-1.6-4.2-1.6-5.8 0-1.6 1.6-1.6 4.2 0 5.8l8.8 8.8 8.8-8.8c1.6-1.6 1.6-4.2 0-5.8Z"/></svg>
      <span style="font-size: 12px; font-weight: 800; color: #edeff1;">{{ likeCount }}</span>
    </button>
    <button onClick="{{ toggleShare }}" style="flex-grow: 1; display: flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 999px; padding: 9px 14px; background: #0a0a0b; border: 1.5px solid #26262a;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#edeff1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="3.5"/><circle cx="17" cy="7" r="1"/></svg>
      <span style="font-size: 12px; font-weight: 800; color: #edeff1;">Share to Instagram Story</span>
    </button>
  </div>

  <div style="padding: 18px 20px 6px; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 11.5px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; color: #6b7684;">Notes on this photo</div>
    <sc-for list="{{ comments }}" as="c" hint-placeholder-count="3">
      <div style="display: flex; gap: 10px; padding: 11px; border-radius: 12px; background: {{ c.bg }}; border: 1px solid {{ c.border }};">
        <div style="width: 22px; height: 22px; flex-shrink: 0; border-radius: 50%; background: #d68a3c; color: #000000; font-size: 10.5px; font-weight: 800; display: flex; align-items: center; justify-content: center;">{{ c.n }}</div>
        <div>
          <div style="font-size: 12px; font-weight: 700; color: #edeff1;">{{ c.author }}</div>
          <div style="font-size: 12px; color: #98a3b1; margin-top: 2px; line-height: 1.4;">{{ c.text }}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <sc-if value="{{ shareOpen }}" hint-placeholder-val="{{ false }}">
    <div onClick="{{ toggleShare }}" style="position: absolute; inset: 0; background: rgba(8,13,22,0.86); display: flex; align-items: center; justify-content: center; z-index: 20;">
      <div style="width: 220px; height: 390px; border-radius: 22px; background: linear-gradient(165deg, #131315, #000000); overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.55); display: flex; flex-direction: column;">
        <div style="padding: 14px; text-align: center;">
          <div class="disp" style="font-size: 12px; font-weight: 700; letter-spacing: 1px; color: #d68a3c;">FOTOFOTO</div>
        </div>
        <div style="flex-grow: 1; margin: 0 12px; border-radius: 12px; background: linear-gradient(155deg, #2f2f33, #131315);"></div>
        <div style="padding: 12px; text-align: center;">
          <div style="font-size: 9.5px; color: #98a3b1; font-weight: 600;">Framed with FOTOFOTO &middot; Trade Show Booth</div>
        </div>
      </div>
    </div>
  </sc-if>

</div>

</x-dc>
<script data-dc-script>
const PIN_DEFS = [
  { n: 1, top: '28%', left: '62%', author: 'Sarah (Marketing)', text: 'Crop in tighter on the booth signage for the LinkedIn post.' },
  { n: 2, top: '70%', left: '22%', author: 'Budi (Sales)', text: 'Great one for the pitch deck cover slide.' },
  { n: 3, top: '48%', left: '85%', author: 'You', text: 'Can we get the same angle without the pillar in frame?' },
];

class Component extends DCLogic {
  renderVals() {
    const selectedPin = this.state.selectedPin ?? null;
    const liked = this.state.liked ?? false;
    const shareOpen = this.state.shareOpen ?? false;

    const pins = PIN_DEFS.map((p) => ({
      ...p,
      bg: selectedPin === p.n ? '#edeff1' : '#d68a3c',
      select: () => this.setState({ selectedPin: p.n }),
    }));

    const comments = PIN_DEFS.map((p) => ({
      ...p,
      bg: selectedPin === p.n ? 'rgba(217,164,74,0.12)' : '#0a0a0b',
      border: selectedPin === p.n ? '#d68a3c' : '#26262a',
    }));

    return {
      pins,
      comments,
      toggleLike: () => this.setState({ liked: !liked }),
      likeCount: 27 + (liked ? 1 : 0),
      heartBg: liked ? 'rgba(224,96,122,0.14)' : 'transparent',
      heartBorder: liked ? '#e0607a' : '#26262a',
      heartFill: liked ? '#e0607a' : 'none',
      heartStroke: liked ? '#e0607a' : '#edeff1',
      shareOpen,
      toggleShare: () => this.setState({ shareOpen: !shareOpen }),
    };
  }
}
</script>
</body>
</html>

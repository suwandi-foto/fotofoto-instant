<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #000000; color: #edeff1; font-family: 'IBM Plex Sans', system-ui, sans-serif; }
    a { color: #d68a3c; } a:hover { color: #b8752f; }
    .disp { font-family: 'Archivo', system-ui, sans-serif; }
    button { font-family: inherit; cursor: pointer; }
  </style>
</helmet>

<div style="width: 390px; min-height: 1180px; background: #000000; display: flex; flex-direction: column;">

  <div style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 4px;">
    <div style="display: flex; align-items: center; gap: 10px;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#98a3b1" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
      <div style="flex-grow: 1;">
        <div class="disp" style="font-size: 16.5px; font-weight: 700;">Factory Tour Video</div>
        <div style="font-size: 11.5px; color: #98a3b1; margin-top: 1px; font-weight: 600;">Draft v2 &middot; Trust</div>
      </div>
      <div style="font-size: 10px; font-weight: 800; padding: 5px 9px; border-radius: 999px; background: rgba(217,164,74,0.14); border: 1px solid rgba(217,164,74,0.35); color: #d68a3c; white-space: nowrap;">AWAITING NOTES</div>
    </div>
  </div>

  <div style="padding: 0 20px;">
    <div style="position: relative; width: 100%; height: 220px; border-radius: 14px; background: linear-gradient(155deg, #131315, #000000); display: flex; align-items: center; justify-content: center; overflow: hidden;">
      <div style="position: absolute; inset: 0; display: flex; flex-wrap: wrap; align-content: space-around; justify-content: space-around; opacity: 0.5; pointer-events: none;">
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.22); transform: rotate(-24deg);">FOTOFOTO</span>
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.22); transform: rotate(-24deg);">FOTOFOTO</span>
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.22); transform: rotate(-24deg);">FOTOFOTO</span>
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.22); transform: rotate(-24deg);">FOTOFOTO</span>
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.22); transform: rotate(-24deg);">FOTOFOTO</span>
        <span style="font-size: 13px; font-weight: 700; letter-spacing: 2px; color: rgba(255,255,255,0.22); transform: rotate(-24deg);">FOTOFOTO</span>
      </div>
      <div style="width: 56px; height: 56px; border-radius: 50%; background: rgba(217,164,74,0.9); display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#000000"><path d="M8 5v14l11-7Z"/></svg>
      </div>
      <div style="position: absolute; top: 10px; left: 10px; font-size: 9.5px; font-weight: 800; padding: 4px 8px; border-radius: 6px; background: rgba(16,27,44,0.8); color: #edeff1;">LOW-RES · WATERMARKED PREVIEW</div>
      <div style="position: absolute; bottom: 10px; right: 12px; font-size: 10.5px; font-weight: 700; color: #98a3b1;">3:40</div>
    </div>

    <div style="margin-top: 12px; position: relative; height: 30px;">
      <div style="position: absolute; top: 12px; left: 0; right: 0; height: 4px; border-radius: 2px; background: #26262a;"></div>
      <div style="position: absolute; top: 12px; left: 0; width: {{ playedPct }}; height: 4px; border-radius: 2px; background: #d68a3c;"></div>
      <sc-for list="{{ marks }}" as="m" hint-placeholder-count="3">
        <button onClick="{{ m.select }}" style="position: absolute; top: 4px; left: {{ m.pos }}; width: 18px; height: 18px; border-radius: 50%; background: {{ m.bg }}; border: 2px solid #000000; transform: translateX(-50%);"></button>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 10.5px; color: #6b7684; margin-top: 4px;">
      <span>0:00</span><span>3:40</span>
    </div>
  </div>

  <div style="padding: 18px 20px 6px;">
    <button onClick="{{ addNote }}" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1.5px dashed #26262a; border-radius: 12px; padding: 12px; background: transparent; color: #98a3b1; font-size: 12.5px; font-weight: 700;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      Add a note at 0:47
    </button>
  </div>

  <div style="padding: 14px 20px 6px; display: flex; flex-direction: column; gap: 10px;">
    <div style="font-size: 11.5px; font-weight: 800; letter-spacing: 0.5px; text-transform: uppercase; color: #6b7684;">Revision notes</div>
    <sc-for list="{{ notes }}" as="n" hint-placeholder-count="4">
      <div style="display: flex; gap: 10px; padding: 11px; border-radius: 12px; background: {{ n.bg }}; border: 1px solid {{ n.border }};">
        <div style="font-size: 11px; font-weight: 800; color: #d68a3c; flex-shrink: 0; width: 34px;">{{ n.time }}</div>
        <div>
          <div style="font-size: 12px; font-weight: 700; color: #edeff1;">{{ n.author }}</div>
          <div style="font-size: 12px; color: #98a3b1; margin-top: 2px; line-height: 1.4;">{{ n.text }}</div>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; padding: 18px 20px 24px; border-top: 1px solid #26262a; display: flex; flex-direction: column; gap: 10px;">
    <sc-if value="{{ decided }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; align-items: center; gap: 10px; padding: 13px 14px; border-radius: 12px; background: {{ decidedBg }}; border: 1px solid {{ decidedBorder }};">
        <div style="font-size: 12px; font-weight: 700; color: {{ decidedColor }};">{{ decidedText }}</div>
      </div>
    </sc-if>
    <sc-if value="{{ showActions }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; gap: 10px;">
        <button onClick="{{ requestRevisions }}" style="flex-grow: 1; border: none; border-radius: 12px; background: #d68a3c; color: #000000; font-weight: 800; font-size: 12.5px; padding: 13px;">Request Revisions</button>
        <button onClick="{{ approve }}" style="flex-grow: 1; border: 1.5px solid #26262a; border-radius: 12px; background: transparent; color: #edeff1; font-weight: 800; font-size: 12.5px; padding: 13px;">Approve Final Cut</button>
      </div>
    </sc-if>
  </div>

</div>

</x-dc>
<script data-dc-script>
const MARK_DEFS = [
  { id: 'm1', time: '0:22', pos: '10%', author: 'You', text: 'Trim the intro — too slow before the factory floor shot.' },
  { id: 'm2', time: '1:15', pos: '34%', author: 'Budi (Sales)', text: 'Add the ISO certification plaque here, good trust beat.' },
  { id: 'm3', time: '2:50', pos: '78%', author: 'You', text: 'Music gets loud under the CEO voiceover — lower it.' },
];

class Component extends DCLogic {
  renderVals() {
    const selected = this.state.selected ?? null;
    const decision = this.state.decision ?? null;
    const extraNote = this.state.extraNote ?? false;

    const marks = MARK_DEFS.map((m) => ({
      ...m,
      bg: selected === m.id ? '#edeff1' : '#d68a3c',
      select: () => this.setState({ selected: m.id }),
    }));

    let notes = MARK_DEFS.map((m) => ({
      ...m,
      bg: selected === m.id ? 'rgba(217,164,74,0.12)' : '#0a0a0b',
      border: selected === m.id ? '#d68a3c' : '#26262a',
    }));
    if (extraNote) {
      notes = [...notes, { time: '0:47', author: 'You', text: 'New note — flagged for revision.', bg: 'rgba(217,164,74,0.12)', border: '#d68a3c' }];
    }

    const decidedMap = {
      revise: { text: 'Sent back for revision — Creatives will address these notes.', bg: 'rgba(217,164,74,0.1)', border: 'rgba(217,164,74,0.35)', color: '#d68a3c' },
      approve: { text: 'Approved — full-resolution video will be delivered shortly.', bg: 'rgba(74,222,128,0.1)', border: 'rgba(74,222,128,0.3)', color: '#4ade80' },
    };
    const decided = decisionInfo(decision);

    function decisionInfo(d) {
      return decidedMap[d] ?? null;
    }

    return {
      marks,
      notes,
      playedPct: '0%',
      addNote: () => this.setState({ extraNote: true }),
      decided: !!decided,
      decidedText: decided?.text,
      decidedBg: decided?.bg,
      decidedBorder: decided?.border,
      decidedColor: decided?.color,
      showActions: !decided,
      requestRevisions: () => this.setState({ decision: 'revise' }),
      approve: () => this.setState({ decision: 'approve' }),
    };
  }
}
</script>
</body>
</html>
